{% extends "base.html" %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center align-items-center">

<div class="col-lg-5">

<div class="card shadow border-0">

<div class="card-body p-5">

<div class="text-center">

<img src="{% static 'images/logo.png' %}" width="100" class="mb-4">

<h2 class="mt-3">

Welcome Back

</h2>

<p class="text-muted">

Login to your account

</p>

</div>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Username</label>

<input
type="text"
name="username"
class="form-control">

</div>

<div class="mb-4">

<label>Password</label>

<input
type="password"
name="password"
class="form-control">

</div>

<button class="btn btn-primary w-100">

Login

</button>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="{% url 'register' %}">

Register

</a>

</p>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
