{% extends "base.html" %}

{% block title %}Edit Category{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h3 class="fw-bold mb-4">
                        Edit {{ category.name }}
                    </h3>


                    {% if category.image %}

                    <div class="mb-4">

                        <label class="form-label fw-bold">
                            Current Image
                        </label>

                        <img
                            src="{{ category.image.url }}"
                            alt="{{ category.name }}"
                            class="img-fluid rounded"
                            style="
                                width: 100%;
                                max-height: 300px;
                                object-fit: cover;
                            "
                        >

                    </div>

                    {% endif %}


                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Category Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ category.name }}"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Replace Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                            >

                            <small class="text-muted">
                                Choose a new image to replace the current one.
                            </small>

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                <i class="bi bi-save"></i>
                                Save Changes
                            </button>


                            <a
                                href="{% url 'category_management' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
